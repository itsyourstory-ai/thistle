name: CI

# Runs lint + tests on every PR and on pushes to the long-lived branches.
# Branch protection (configured separately) makes these checks REQUIRED, so a
# failing run blocks the merge — and therefore blocks the Vercel deploy.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (catch build-time errors)
        run: npm run build
